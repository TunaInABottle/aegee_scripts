<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #f4f4f9;
        margin: 0;
      }
      h2 {
        color: #333;
        text-align: center;
      }
      form {
        background-color: #ffffff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        margin: 0 auto;
      }
      label {
        font-size: 16px;
        font-weight: 600;
        color: #333;
        display: block;
        margin-bottom: 8px;
      }
      select {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        border-radius: 5px;
        border: 1px solid #ddd;
        margin-bottom: 20px;
        background-color: #fafafa;
        transition: border-color 0.3s;
      }
      select:focus {
        outline: none;
        border-color: #0078d4;
        background-color: #fff;
      }
      button[type="submit"] {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        background-color: #0078d4;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      button[type="submit"]:hover {
        background-color: #005fa3;
      }
      #status {
        text-align: center;
        margin-top: 12px;
        font-size: 14px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h2>Select Email Alias</h2>
    <form id="aliasForm" onsubmit="submitSelection(); return false;">
      <label for="emailAlias">Choose the email alias:</label>
      <select name="emailAlias" id="emailAlias" required>
        <option value="" disabled selected>Select an email alias</option>
        <? for (var i = 0; i < emailOptions.length; i++) { ?>
          <option value="<?= emailOptions[i] ?>"><?= emailOptions[i] ?></option>
        <? } ?>
      </select>
      <button type="submit" id="submitBtn">Submit</button>
    </form>
    <div id="status"></div>
    <script>
      function submitSelection() {
        const selectedAlias = document.getElementById("emailAlias").value;
        const btn = document.getElementById("submitBtn");
        const status = document.getElementById("status");
        btn.disabled = true;
        btn.textContent = "Sending...";
        status.textContent = "Processing, please wait...";
        google.script.run
          .withSuccessHandler(function() {
            google.script.host.close();
          })
          .withFailureHandler(function(err) {
            btn.disabled = false;
            btn.textContent = "Submit";
            status.textContent = "Error: " + err.message;
          })
          .<?= callbackFunction ?>(selectedAlias);
      }
    </script>
  </body>
</html>
